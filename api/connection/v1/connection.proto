syntax = "proto3";

package akira.connection.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/PinguinAdvokat/akira-mcp/pkg/api/connectionpb/v1;connectionpb";

// connectionService — долгоживущее соединение: клиент подключается,
// сервер отправляет команды для исполнения по одностороннему потоку,
// клиент возвращает результаты отдельным методом SubmitResult.
service ConnectionService {
  // Connect открывает односторонний поток сервер→клиент.
  // Регистрация выполняется самим запросом; первое сообщение потока —
  // RegisterResponse, далее сервер присылает Task.
  rpc Connect(RegisterRequest) returns (stream ServerMessage);

  // SubmitResult возвращает результат исполнения задачи.
  // Сервер сопоставляет результат с ожидающей задачей по task_id.
  rpc SubmitResult(TaskResult) returns (SubmitResultResponse);

  // Heartbeat — проверка живости: клиент периодически вызывает метод,
  // сервер отвечает Pong с тем же seq.
  rpc Heartbeat(Ping) returns (Pong);
}

// ServerMessage — конверт для сообщений сервера в потоке Connect.
message ServerMessage {
  oneof payload {
    RegisterResponse register_ack = 1;
    Task task = 2;
  }
}

// SubmitResultResponse — подтверждение приёма результата.
// Результат задач, которых сервер уже не ждёт (например, истёк
// таймаут), принимается молча: это нормальная ситуация.
message SubmitResultResponse {}

// RegisterRequest — запрос на подключение.
message RegisterRequest {
  // client_id — уникальный идентификатор клиента (uuid). Обязателен.
  string client_id = 1;
  string hostname = 2;
  // platform — целевая ОС: linux / darwin / windows.
  string platform = 3;
  // connect_key — короткий ключ пользователя из auth-сервиса;
  // по нему сервер находит владельца подключения. Обязателен.
  string connect_key = 4;
}

// RegisterResponse — первое сообщение потока после регистрации.
message RegisterResponse {
  string session_id = 1;
  // heartbeat_interval_ms — период вызова Ping клиентом.
  int64 heartbeat_interval_ms = 2;
  // connection_id — назначенный сервером ключ подключения
  // формата {user_id}:{client_id}. Клиент подписывает им TaskResult.
  string connection_id = 3;
}

message Ping {
  int64 seq = 1;
}

message Pong {
  int64 seq = 1;
}

// task — команда для исполнения клиентом. Поле id обязательно:
// клиент возвращает его в TaskResult.task_id.
message Task {
  string id = 1;
  oneof payload {
    ExecTask exec = 2;
    ReadFileRequest read_file = 3;
    WriteFileRequest write_file = 4;
    EditFileRequest edit_file = 7;
    GlobRequest glob = 8;
    ListRequest list = 9;
  }
  google.protobuf.Timestamp created_at = 5;
  // timeout_ms — лимит исполнения; 0 означает без таймаута.
  int64 timeout_ms = 6;
}

// ExecTask — запуск процесса.
message ExecTask {
  string cmd = 1;
}

// ReadFileRequest — прочитать окно строк файла и вернуть содержимое.
message ReadFileRequest {
  string path = 1;
  // max_bytes — ограничение размера ответа (применяется к окну);
  // 0 = без ограничения.
  int64 max_bytes = 2;
  // offset — номер первой строки окна (1-based); 0 или 1 — с начала.
  int64 offset = 3;
  // limit — сколько строк вернуть; 0 = без ограничения строк
  // (объём ответа всё равно ограничен max_bytes).
  int64 limit = 4;
}

// WriteFileRequest — записать файл.
message WriteFileRequest {
  string path = 1;
  bytes content = 2;
  bool create_dirs = 3;
}

// EditFileRequest — заменить вхождения old_str на new_str.
// При replace_all = false строка old_str обязана встречаться
// в файле ровно один раз, иначе задача завершается STATUS_ERROR.
message EditFileRequest {
  string path = 1;
  string old_str = 2;
  string new_str = 3;
  bool replace_all = 4;
}

// GlobRequest — поиск файлов по шаблону (**, *, ?, [class])
// в каталоге path и ниже.
message GlobRequest {
  // path — базовый каталог поиска (абсолютный путь).
  string path = 1;
  // pattern — шаблон относительно path, например "**/*.go".
  string pattern = 2;
}

// ListRequest — листинг каталога path до глубины depth.
message ListRequest {
  string path = 1;
  // depth — глубина обхода: 1 = только непосредственные дети.
  int32 depth = 2;
}

// TaskResult — результат исполнения команды.
message TaskResult {
  string task_id = 1;
  Status status = 2;
  // exit_code — валиден только для ExecTask.
  int32 exit_code = 3;
  // stdout — валиден для ExecTask и ReadFileRequest.
  bytes stdout = 4;
  // stderr — валиден только для ExecTask.
  bytes stderr = 5;
  // error — текст ошибки при status = STATUS_ERROR.
  string error = 6;
  // duration_ms — фактическое время исполнения.
  int64 duration_ms = 7;
  // connection_id — ключ подключения, исполнившего задачу
  // ({user_id}:{client_id}, выдаётся в RegisterResponse). Сервер
  // сверяет его с владельцем ожидающей задачи; пустое значение
  // принимается (совместимость со старыми клиентами).
  string client_id = 8;
  // total_lines — read_file: всего строк в файле; glob/list: всего
  // записей до ограничения. 0 = не известно.
  int64 total_lines = 9;
  // truncated — ответ обрезан ограничением (max_bytes для read,
  // лимит записей для glob/list).
  bool truncated = 10;

  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_OK = 1;
    STATUS_ERROR = 2;
    STATUS_TIMEOUT = 3;
    STATUS_REJECTED = 4;
  }
}
