syntax = "proto3";

package akira.connection.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/PinguinAdvokat/akira-mcp/pkg/api/connectionpb/v1;connectionpb";

// connectionService — долгоживущее stream-соединение: клиент подключается
// и держит поток открытым, сервер отправляет команды для исполнения,
// клиент возвращает результаты по тому же потоку.
service ConnectionService {
  // Connect открывает двунаправленный поток. Первым сообщением клиент
  // обязан отправить RegisterRequest.
  rpc Connect(stream ClientMessage) returns (stream ServerMessage);
}

// ClientMessage — конверт для всех сообщений клиента.
message ClientMessage {
  oneof payload {
    RegisterRequest register = 1;
    TaskResult result = 2;
    Ping ping = 3;
  }
}

// ServerMessage — конверт для всех сообщений сервера.
message ServerMessage {
  oneof payload {
    RegisterResponse register_ack = 1;
    Task task = 2;
    Pong pong = 3;
  }
}

// RegisterRequest — первое сообщение при подключении.
message RegisterRequest {
  // client_id — уникальный идентификатор клиента (uuid). Обязателен.
  string client_id = 1;
  string hostname = 2;
  // platform — целевая ОС: linux / darwin / windows.
  string platform = 3;
}

// RegisterResponse — подтверждение регистрации.
message RegisterResponse {
  string session_id = 1;
  // heartbeat_interval_ms — период отправки Ping клиентом.
  int64 heartbeat_interval_ms = 2;
}

message Ping {
  int64 seq = 1;
}

message Pong {
  int64 seq = 1;
}

// task — команда для исполнения клиентом. Поле id обязательно:
// клиент возвращает его в TaskResult.task_id.
message Task {
  string id = 1;
  oneof payload {
    ExecTask exec = 2;
    ReadFileRequest read_file = 3;
    WriteFileRequest write_file = 4;
  }
  google.protobuf.Timestamp created_at = 5;
  // timeout_ms — лимит исполнения; 0 означает без таймаута.
  int64 timeout_ms = 6;
}

// ExecTask — запуск процесса.
message ExecTask {
  string cmd = 1;
}

// ReadFileRequest — прочитать файл и вернуть содержимое.
message ReadFileRequest {
  string path = 1;
  // max_bytes — ограничение размера ответа; 0 = без ограничения.
  int64 max_bytes = 2;
}

// WriteFileRequest — записать файл.
message WriteFileRequest {
  string path = 1;
  bytes content = 2;
  bool create_dirs = 3;
}

// TaskResult — результат исполнения команды.
message TaskResult {
  string task_id = 1;
  Status status = 2;
  // exit_code — валиден только для ExecTask.
  int32 exit_code = 3;
  // stdout — валиден для ExecTask и ReadFileRequest.
  bytes stdout = 4;
  // stderr — валиден только для ExecTask.
  bytes stderr = 5;
  // error — текст ошибки при status = STATUS_ERROR.
  string error = 6;
  // duration_ms — фактическое время исполнения.
  int64 duration_ms = 7;

  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_OK = 1;
    STATUS_ERROR = 2;
    STATUS_TIMEOUT = 3;
    STATUS_REJECTED = 4;
  }
}
