syntax = "proto3";

package github.com.PinguinAdvokat.akira_mcp.db;

option go_package = "github.com/PinguinAdvokat/akira-mcp/pkg/api/db;db";


import "google/protobuf/empty.proto";

service DBService {
    rpc AddUser(User) returns (google.protobuf.Empty);
    rpc GetUser(UserID) returns (User);
}

message User {
    string id = 1;
    string name = 2;
    int32 age = 3;
}

message UserID {
    string id = 1;
}
