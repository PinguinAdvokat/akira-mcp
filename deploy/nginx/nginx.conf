# nginx — единственная точка входа снаружи (порт 80, HTTP без TLS).
# Все сервисы изолированы в compose-сети, наружу смотрит только этот
# прокси. Маршрутизация по пути:
#   /akira.connection.v1.ConnectionService/…  → gRPC  akira-server:5000 (h2c)
#   /mcp, /.well-known/oauth-protected-resource/… → MCP  akira-server:7000
#   всё остальное (auth: /register, /token, /jwks.json, /authorize…) → auth:6000
#
# Upstream-имена (akira-server, auth) резолвятся один раз на старте —
# docker DNS отдаёт актуальный IP при запуске контейнера nginx; если
# сервис пересоздан с новым IP, nginx надо перезапустить. Альтернатива
# (resolver + переменные) не нужна при порядковой пересборке стека.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /var/log/nginx/access.log;

    server {
        listen 80;
        # h2c prior-knowledge: gRPC-клиенты ходят HTTP/2 без TLS,
        # обычные HTTP/1.1-запросы работают на том же порту.
        http2 on;

        # ── gRPC: обратный командный канал (акира-клиенты) ──────────
        location /akira.connection.v1.ConnectionService/ {
            grpc_pass grpc://akira-server:5000;
            # Connect — долгоживущий стрим: и клиент, и сервер пингуют
            # keepalive-ом (30с), PING-кадры сбрасывают read-таймаут;
            # 120с — с запасом больше двух интервалов пинга.
            grpc_read_timeout 120s;
            grpc_send_timeout 120s;
        }

        # ── MCP: JSON-RPC для LLM-клиентов ──────────────────────────
        location /mcp {
            proxy_pass http://akira-server:7000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Вызов инструмента держит запрос открытым на время задачи
            # на клиенте — до MCP_TASK_TIMEOUT_MS (120с по умолчанию)
            # плюс накладные расходы → с запасом.
            proxy_read_timeout 300s;
            # write_file несёт содержимое файла прямо в JSON-RPC.
            client_max_body_size 32m;
        }

        # PRM (RFC 9728) — публичный, без авторизации.
        location /.well-known/oauth-protected-resource/ {
            proxy_pass http://akira-server:7000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 2m;
        }

        # ── auth: всё остальное ─────────────────────────────────────
        location / {
            proxy_pass http://auth:6000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Лимит приложения — 1 MiB (413 отдаёт само приложение);
            # 2m — чтобы не перехватывать его собственный ответ.
            client_max_body_size 2m;
        }
    }
}
