services:
  postgres:
    image: postgres:17
    container_name: akira-postgres
    environment:
      POSTGRES_USER: akira
      POSTGRES_PASSWORD: akira
      POSTGRES_DB: akira
    # Только loopback: БД нужна снаружи для локальной разработки
    # (go run ./cmd/..., TEST_DATABASE_URL), но не должна быть видна
    # с других машин.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akira -d akira"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth:
    build:
      context: .
      target: auth
    container_name: akira-auth
    # Конфигурация — из .env (как при локальном запуске), но адреса
    # внутри compose-сети отличаются от 127.0.0.1 в .env — их
    # переопределяем явно. AUTH_PUBLIC_URL строится от публичного
    # адреса через nginx (порт 80), а не от дефолтного 127.0.0.1:6000.
    env_file: .env
    environment:
      DATABASE_URL: postgres://akira:akira@postgres:5432/akira
      AUTH_PUBLIC_URL: http://localhost
    # Наружу auth не смотрит — только через nginx.
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:6000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  akira-server:
    build:
      context: .
      target: akira-server
    container_name: akira-server
    env_file: .env
    environment:
      DATABASE_URL: postgres://akira:akira@postgres:5432/akira
      # Публичные URL: внешние MCP-клиенты ходят через nginx (порт 80).
      MCP_PUBLIC_URL: http://localhost
      MCP_AUTH_SERVER_URL: http://localhost
      # А JWKS акира-сервер забирает сам (server-side fetch) — напрямую
      # по внутренней сети, nginx не нужен.
      MCP_JWKS_URL: http://auth:6000/jwks.json
    # Наружу 5000 (gRPC) и 7000 (MCP) не смотрят — только через nginx.
    depends_on:
      postgres:
        condition: service_healthy
      # NewTokenValidator блокируется до первого успешного JWKS-фетча
      # (auth.go, cache.Register), поэтому auth должен слушать до старта
      # akira-server: без этого сервер зависает на первой загрузке стека.
      auth:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine
    container_name: akira-nginx
    # Единственная точка входа снаружи: весь внешний трафик (включая
    # gRPC по http/2, h2c) приходит сюда. Конфиг — отдельным файлом,
    # монтируется read-only.
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      auth:
        condition: service_healthy
      akira-server:
        condition: service_started
    restart: unless-stopped
    # Проверяет и nginx, и auth за ним — маршрут по умолчанию ведёт туда.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
