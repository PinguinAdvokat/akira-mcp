services:
  postgres:
    image: postgres:17
    container_name: akira-postgres
    environment:
      POSTGRES_USER: akira
      POSTGRES_PASSWORD: akira
      POSTGRES_DB: akira
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akira -d akira"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
